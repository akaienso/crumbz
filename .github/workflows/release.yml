name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      # Opens or updates the release PR from merged Conventional Commit PRs. Merging that PR
      # creates the tag and the GitHub release. RELEASE_PLEASE_TOKEN is used so the release PR
      # triggers CI; without it, the GITHUB_TOKEN fallback still works but CI will not run on the release PR.
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  auto-merge-release-pr:
    name: auto-merge-release-pr
    needs: release-please
    if: needs.release-please.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # Turns on auto-merge for the release PR that release-please just opened or updated. The PR is taken
      # from release-please's own output, and its head branch must be release-please's branch.
      # GitHub merges it once the required checks pass.
      - name: Enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          if [ -z "$PR_JSON" ]; then
            echo "No release PR from this run."
            exit 0
          fi
          number=$(jq -r '.number // empty' <<< "$PR_JSON")
          head=$(jq -r '.headBranchName // empty' <<< "$PR_JSON")
          if [[ ! "$number" =~ ^[0-9]+$ ]] || [ "$head" != "release-please--branches--main" ]; then
            echo "::error::Release PR output did not match the expected release branch. Not enabling auto-merge."
            exit 1
          fi
          gh pr merge "$number" -R "$GITHUB_REPOSITORY" --auto --squash

  build-zip:
    name: build-zip
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build crumbz.zip from the files listed as shipped
        run: |
          mkdir -p dist/crumbz
          rsync -a --exclude-from=.distignore ./ dist/crumbz/
          (cd dist && zip -qr ../crumbz.zip crumbz)
          unzip -l crumbz.zip | tail -1
      # The release is a draft until the zip is attached. Immutable releases reject uploads after publishing.
      - name: Attach the zip to the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" crumbz.zip --clobber -R "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
