name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branch-name:
    name: branch-name
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch name is semantic
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          # type/short-description, where type is one of the Conventional Commit types.
          # release-please's own release branch is the only other name allowed.
          if [[ "$BRANCH" =~ ^(feat|fix|chore|docs|refactor|test|ci|build|perf|revert)/[a-z0-9][a-z0-9._-]*$ ]] \
             || [ "$BRANCH" = "release-please--branches--main" ]; then
            echo "Branch name OK: $BRANCH"
          else
            echo "::error::Branch '$BRANCH' is not a semantic name. Use type/short-description, for example feat/icon-cookie or fix/banner-focus. Allowed types: feat, fix, chore, docs, refactor, test, ci, build, perf, revert."
            exit 1
          fi

  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Check the PR title is a Conventional Commit
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  php-lint:
    name: php-lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: Lint every PHP file
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l

  js-check:
    name: js-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check the front-end script
        run: node --check assets/js/frontend.js
